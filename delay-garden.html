<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>延迟花园 Delay Garden</title>
<style>
  @font-face{font-family:"Zpix";src:url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/Zpix.woff2") format("woff2");font-display:swap;}
  :root{
    --bg1:#3a2b3d;--bg2:#2b1f2e;
    --wood:#8a5230;--wood-d:#5c3520;--cream:#f7e6c0;--cream2:#eed9a8;--paper:#fdf3da;
    --ink:#5a3a22;--ink-l:#8a6a48;
    --gold:#e8a020;--gold-d:#b0741a;--exp:#5a9e3a;--red:#c94f4f;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Zpix",ui-monospace,"Microsoft YaHei",monospace;}
  body{color:var(--cream);display:flex;flex-direction:column;align-items:center;padding:14px;image-rendering:pixelated;
    background:var(--bg2);
    background-image:radial-gradient(circle at 20% 30%,rgba(245,197,66,.06) 0 2px,transparent 2px),
      radial-gradient(circle at 70% 60%,rgba(245,197,66,.05) 0 2px,transparent 2px),
      radial-gradient(circle at 45% 85%,rgba(232,143,176,.05) 0 2px,transparent 2px),
      linear-gradient(180deg,var(--bg1),var(--bg2) 60%);
    background-size:220px 220px,180px 180px,260px 260px,100% 100vh;background-attachment:fixed;min-height:100vh;}
  h1{font-size:22px;letter-spacing:4px;margin:6px 0 14px;color:#f5d78a;
    text-shadow:0 3px 0 #1a1016,0 0 18px rgba(245,197,66,.25);}
  #wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1200px;}
  canvas{border:5px solid var(--wood-d);outline:3px solid #1a1016;border-radius:3px;
    box-shadow:inset 0 0 0 2px var(--wood),0 8px 0 #1a1016,0 12px 24px rgba(0,0,0,.5);cursor:crosshair;background:#000;}
  .panel{background:var(--paper);color:var(--ink);border:4px solid var(--wood-d);outline:3px solid #1a1016;border-radius:4px;
    box-shadow:inset 0 0 0 3px var(--wood),inset 0 0 0 5px var(--cream2),0 7px 0 #1a1016,0 10px 20px rgba(0,0,0,.45);
    padding:14px;width:334px;}
  .panel b{color:var(--ink);}
  .stats{display:flex;gap:8px;font-size:14px;margin-bottom:8px;flex-wrap:wrap;}
  .stats span{background:var(--cream);padding:4px 9px;border-radius:3px;border:2px solid var(--wood);
    box-shadow:0 2px 0 var(--wood-d);}
  .gold{color:var(--gold-d)} .expc{color:var(--exp)}
  .bar{height:14px;background:#d8c090;border:2px solid var(--wood);border-radius:7px;overflow:hidden;margin:4px 0 12px;
    box-shadow:inset 0 2px 3px rgba(90,58,34,.4);}
  .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#5a9e3a 0 6px,#74c04c 6px 12px);
    border-right:2px solid #3d7024;width:0%;transition:width .5s;}
  textarea{width:100%;height:64px;background:var(--cream);color:var(--ink);border:2px solid var(--wood);
    box-shadow:inset 0 2px 3px rgba(90,58,34,.3);border-radius:3px;padding:8px;font-size:13px;resize:none;font-family:inherit;}
  textarea::placeholder{color:var(--ink-l);}
  button{background:linear-gradient(180deg,#f5c542,#e8a020);color:#5a3a10;border:2px solid var(--wood-d);
    border-radius:3px;padding:6px 12px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;
    box-shadow:inset 0 2px 0 #ffe9a0,0 3px 0 #1a1016;margin-top:6px;text-shadow:0 1px 0 #ffe9a0;}
  button:hover{filter:brightness(1.07);}
  button:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffe9a0,0 1px 0 #1a1016;}
  button.small{font-size:12px;padding:3px 9px;}
  button:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed;}
  .tabs{display:flex;gap:6px;margin:10px 0 8px;}
  .tabs button{background:var(--cream2);color:var(--ink-l);box-shadow:0 3px 0 #1a1016;text-shadow:none;}
  .tabs button.on{background:linear-gradient(180deg,#f5c542,#e8a020);color:#5a3a10;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:250px;overflow-y:auto;padding:2px;}
  .grid::-webkit-scrollbar{width:10px;} .grid::-webkit-scrollbar-thumb{background:var(--wood);border-radius:5px;border:2px solid var(--paper);}
  .item{background:var(--cream);border:2px solid var(--wood);border-radius:3px;padding:7px;font-size:12px;
    display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 0 var(--wood-d);}
  .item b{font-size:13px;}
  .scenes .item.locked{opacity:.55;background:#e0d0b0;}
  #result{font-size:13px;background:#fff8e6;border:2px dashed var(--wood);border-radius:3px;padding:9px;margin-top:8px;
    min-height:40px;display:none;color:var(--ink);}
  #log{font-size:11px;max-height:120px;overflow-y:auto;margin-top:6px;color:var(--ink-l);}
  #log div{padding:3px 0;border-bottom:1px dashed #d8c090;}
  .hint{font-size:11px;color:#c8b088;margin-top:8px;text-shadow:0 1px 0 #1a1016;}
  .panel .hint{color:var(--ink-l);text-shadow:none;}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#f5c542,#e8a020);color:#5a3a10;padding:9px 20px;
    border:3px solid var(--wood-d);outline:2px solid #1a1016;border-radius:4px;font-weight:bold;display:none;z-index:9;
    box-shadow:inset 0 2px 0 #ffe9a0,0 5px 0 #1a1016,0 8px 20px rgba(0,0,0,.4);animation:pop .25s;}
  @keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}
  #cardOv{position:fixed;inset:0;background:rgba(20,12,24,.65);display:none;align-items:center;justify-content:center;z-index:20;}
  #cardBox{background:var(--paper);border:4px solid var(--wood-d);outline:3px solid #1a1016;border-radius:6px;
    box-shadow:inset 0 0 0 3px var(--wood),0 8px 0 #1a1016,0 14px 30px rgba(0,0,0,.5);
    padding:18px;width:290px;text-align:center;color:var(--ink);animation:pop2 .22s;}
  @keyframes pop2{from{transform:scale(.75);opacity:0;}to{transform:scale(1);opacity:1;}}
  #cardCv{image-rendering:pixelated;border:3px solid var(--wood);background:#cfe0b8;border-radius:4px;}
  #cardEmoji{font-size:56px;line-height:1.4;}
  #cardTitle{font-weight:bold;font-size:16px;margin:8px 0 6px;}
  #cardStory{font-size:12px;color:var(--ink-l);text-align:left;line-height:1.7;margin-bottom:8px;}
  .item.clickable{cursor:pointer;}
  .item.clickable:hover{filter:brightness(1.05);}
</style>
</head>

<h1>🌿 延迟花园 · Delay Garden</h1>
<div id="toast"></div>
<div id="pill" style="display:none;position:fixed;right:18px;top:72px;z-index:15;cursor:grab;user-select:none;
  background:linear-gradient(180deg,#f5c542,#e8a020);color:#5a3a10;font-weight:bold;font-size:13px;
  padding:7px 14px;border:3px solid var(--wood-d);outline:2px solid #1a1016;border-radius:20px;
  box-shadow:inset 0 2px 0 #ffe9a0,0 4px 0 #1a1016,0 7px 16px rgba(0,0,0,.35);max-width:260px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
<div id="cardOv" onclick="this.style.display='none'">
  <div id="cardBox" onclick="event.stopPropagation()">
    <canvas id="cardCv" width="40" height="40" style="width:160px;height:160px;display:none"></canvas>
    <div id="cardEmoji" style="display:none"></div>
    <div id="cardTitle"></div>
    <div id="cardStory"></div>
    <button class="small" onclick="document.getElementById('cardOv').style.display='none'">合上卡片</button>
  </div>
</div>
<div id="wrap">
  <div>
    <canvas id="cv" width="320" height="180" style="width:640px;height:360px"></canvas>
    <div class="hint">← → ↑ ↓ 走动 ｜ 点击场景放置选中的家具 ｜ 拖动家具移动，拖出画面收回背包 ｜ 双击家具左右翻转</div>
    <div class="panel scenes" style="width:640px;margin-top:10px;">
      <b>🗺 场景（用经验解锁，解锁后点击前往探索）</b>
      <div class="grid" id="sceneList" style="grid-template-columns:repeat(3,1fr);margin-top:6px;"></div>
    </div>
  </div>
  <div class="panel">
    <div class="stats">
      <span class="expc">Lv.<b id="lv">1</b></span>
      <span class="expc">EXP <b id="exp">0</b></span>
      <span class="gold">🪙 <b id="coins">0</b></span>
      <span>🔥连续 <b id="streak">0</b> 天</span>
    </div>
    <div class="bar"><i id="expbar"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <b>🍅 番茄钟</b><span id="pomoCount" class="hint" style="margin:0;"></span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin:4px 0 10px;">
      <span id="pomoTime" style="font-size:19px;font-weight:bold;min-width:52px;">25:00</span>
      <div class="bar" style="flex:1;margin:0;"><i id="pomoBar"></i></div>
      <button class="small" id="pomoPause" onclick="pomoPause()" style="margin:0;display:none;">⏸</button>
      <button class="small" id="pomoBtn" onclick="pomoClick()" style="margin:0;">开始专注</button>
    </div>
    <b>📋 今日任务</b>
    <div style="display:flex;gap:6px;margin:4px 0;align-items:center;">
      <input id="taskInput" placeholder="要做的事，回车添加"
        style="flex:1;background:var(--cream);color:var(--ink);border:2px solid var(--wood);border-radius:3px;padding:5px 8px;font-size:12px;font-family:inherit;">
      <input id="taskEst" type="number" min="1" max="12" value="1" title="预估需要几个番茄"
        style="width:40px;background:var(--cream);color:var(--ink);border:2px solid var(--wood);border-radius:3px;padding:5px 4px;font-size:12px;font-family:inherit;">
      <span style="font-size:12px;">🍅</span>
      <button class="small" onclick="addTask()" style="margin:0;">＋</button>
    </div>
    <div id="taskList" style="font-size:12px;margin-bottom:10px;"></div>
    <b>✍️ 记录一次延迟满足</b>
    <textarea id="eventText" placeholder="例：忍住没有在社媒搜索布拉塔沙拉做法，而是开始写代码"></textarea>
    <button id="submitBtn" onclick="submitEvent()">提交给评估器分析</button>
    <div id="result"></div>
    <div class="tabs">
      <button class="on" onclick="setTab('shop',this)">🛒 商店</button>
      <button onclick="setTab('skin',this)">👗 衣柜</button>
      <button onclick="setTab('furn',this)">🪑 背包</button>
      <button onclick="setTab('dex',this)">📔 图鉴</button>
    </div>
    <div class="grid" id="itemGrid"></div>
    <b style="display:block;margin-top:10px">📜 今日记录</b>
    <div id="log"></div>
  </div>
</div>

function openCard(kind,id){

    const v=VISITORS.find(a=>a.id===id),lvv=(S.visitorLv&&S.visitorLv[id])||0;
    cv2.style.display="inline-block";em.style.display="none";
    const c2=cv2.getContext("2d"),old=ctx;ctx=c2;
    R(0,0,40,40,"#cfe0b8");R(0,32,40,8,"#a8c890");dith(0,30,40,4,"#b8d4a0");
    if(lvv>0){ctx.save();ctx.translate(12,12);drawVisitor({id:v.id,x:0,y:6},lvv,T);ctx.restore();}

function vLevel(c){let l=0;for(const th of VLV)if(c>=th)l++;return l;}
function checkVisitors(){
  if(!S.dims)return;
  if(!S.visitorLv)S.visitorLv={};
  VISITORS.forEach(v=>{
    const nl=vLevel(S.dims[v.dim]||0),ol=S.visitorLv[v.id]||0;
    if(nl>ol){S.visitorLv[v.id]=nl;
      const sc=SCENES.find(s=>s.id===v.scene).name;
      if(ol===0)toast(`🌱 好像有什么东西落在了${sc}…`);
      if(nl>=2&&ol<2){toast(`🐣 ${sc}里的种子孵化了！快去看看`);
        if(!S.gifted)S.gifted={};
        if(!S.gifted[v.id]){S.gifted[v.id]=true;S.furniture.push(VGIFT[v.id]);
          setTimeout(()=>toast(`🎁 收到一件礼物！去家具背包看看`),2800);}}
      if(nl>=4&&ol<4)setTimeout(()=>toast(`💛 与「${v.name}」羁绊满级！`),2800);
    }});
}
function rollDiscovery(exp){
  if(Math.random()>=0.12+exp*0.0015)return null;
  const tot=COLLECTIBLES.reduce((a,c)=>a+c.w,0);
  let roll=Math.random()*tot;
  for(const c of COLLECTIBLES){roll-=c.w;if(roll<=0)return c;}
  return COLLECTIBLES[0];
}
function applyDims(dims){
  if(!dims||!dims.length)return;
  if(!S.dims)S.dims={resist:0,stop:0,sustain:0,noswitch:0};
  dims.forEach(d=>S.dims[d]=(S.dims[d]||0)+1);
  checkVisitors();
}
const LV_EXP=l=>Math.round(50*Math.pow(l,1.6)); // 累计经验到达即升级

/* ================= 存档 ================= */
async function load(){try{const r=await fetch("/api/load");const d=await r.json();if(d&&d.equip&&d.equip.dress)S=Object.assign(S,d);}catch(e){const l=localStorage.getItem("delayGarden");if(l)S=Object.assign(S,JSON.parse(l));}
  updateStreak();
  // v3：访客羁绊清零，从现在的记录重新养成（经验/金币/日志保留）
  if(!S.dims||S.dims.resist===undefined||S.dimsV!==3){
    S.dims={resist:0,stop:0,sustain:0,noswitch:0};
    S.dimsV=3;
    S.visitorLv={};S.visitorSeen={};
    if(!S.collection)S.collection={};
    if(!S.gifted)S.gifted={};
    // 已到手的礼物标记为已赠送，避免将来重复发放
    Object.entries(VGIFT).forEach(([vid,gid])=>{
      const has=(S.furniture||[]).includes(gid)||
        Object.values(S.placed||{}).some(a=>a.some(f=>f.id===gid));
      if(has)S.gifted[vid]=true;});
    save();
  }
  refreshUI();}
let saveTimer=null;
function save(){localStorage.setItem("delayGarden",JSON.stringify(S));clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>fetch("/api/save",{method:"POST",body:JSON.stringify(S)}).catch(()=>{}),400);}
function updateStreak(){const t=today();if(S.lastDay===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(S.lastDay!==y&&S.lastDay!==null&&S.lastDay!==t)S.streak=0;}

/* ================= 等级/场景 ================= */
function level(){let l=1;while(S.exp>=LV_EXP(l))l++;return l;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600);}

/* ================= 事件提交 ================= */
async function submitEvent(){
  const ta=document.getElementById("eventText"),text=ta.value.trim();
  if(!text)return toast("先写下你抵抗了什么诱惑～");
  const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="分析中…";
  const cnt=(S.log[today()]||[]).length;
  let res;
  try{const r=await fetch("/api/evaluate",{method:"POST",body:JSON.stringify({text,todayCount:cnt})});res=await r.json();}
  catch(e){res={exp:20,coins:4,comment:"（离线模式）记录成功，继续加油！"};}
  const oldLv=level(),oldUnlocked=SCENES.filter(s=>S.exp>=s.need).length;
  S.exp+=res.exp;S.coins+=res.coins;
  if(!S.log[today()]){S.log[today()]=[];S.streak++;S.lastDay=today();}
  S.log[today()].push({text,exp:res.exp,coins:res.coins});
  const rd=document.getElementById("result");rd.style.display="block";
  rd.innerHTML=`<span class="expc">+${res.exp} EXP</span> <span class="gold">+${res.coins} 🪙</span><br>${res.comment}`;
  applyDims(res.dims);
  const disc=rollDiscovery(res.exp);
  if(disc){if(!S.collection)S.collection={};
    S.collection[disc.id]=(S.collection[disc.id]||0)+1;
    rd.innerHTML+=`<br>✨ 探索发现：${disc.e}「${disc.n}」！已记入图鉴`;}
  if(level()>oldLv)toast(`✨ 升级到 Lv.${level()}！`);
  const nu=SCENES.filter(s=>S.exp>=s.need).length;
  if(nu>oldUnlocked)toast(`🗺 新场景「${SCENES[nu-1].name}」被发现了！快去探索！`);
  ta.value="";btn.disabled=false;btn.textContent="提交给评估器分析";
  save();refreshUI();
}

const cv=document.getElementById("cv");let ctx=cv.getContext("2d");
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}
function seeded(n){let s=n;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function dith(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=j%2;i<w;i+=2)R(x+i,y+j,1,1,c);}
function blob(cx,cy,rx,ry,c){ry=Math.max(1,ry);
  for(let j=-ry;j<=ry;j++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(j*j)/(ry*ry))));
    if(w>0)R(cx-w,cy+j,w*2,1,c);}}
function blit(map,x,y,pal,flip){
  for(let r=0;r<map.length;r++){const row=map[r];
    for(let c=0;c<row.length;c++){const ch=row[c];if(ch===".")continue;
      const col=pal[ch];if(!col)continue;
      R(x+(flip?row.length-1-c:c),y+r,1,1,col);}}}

function cloud(x,y,w,c){R(x,y,w,8,c);R(x+w*.15,y-5,w*.55,6,c);R(x+w*.55,y-3,w*.3,4,c);}

const ANIMAL_SPD={cat:.22,dog:.4,bunny:.5,duck:.16,frog:.45,butterfly:.55};
const wander={};
let lastRend=null;
function stepWander(key,f){
  let w=wander[key];
  if(!w)w=wander[key]={ox:0,oy:0,tx:0,ty:0,wait:60+Math.random()*180};
  if(w.wait>0){w.wait--;return w;}
  const dx=w.tx-w.ox,dy=w.ty-w.oy,d=Math.hypot(dx,dy);
  if(d<1){ // 到达目标：歇一会儿，再选下一个（以家为中心的活动范围）
    const fly=f.id==="butterfly";
    w.wait=(fly?40:90)+Math.random()*(fly?120:260);
    const rx=fly?70:38,ry=fly?50:22,ymin=fly?26:66;
    w.tx=Math.max(6-f.x,Math.min(298-f.x,(Math.random()*rx*2-rx)));
    w.ty=Math.max(ymin-f.y,Math.min(160-f.y,(Math.random()*ry*2-ry)));
    return w;
  }
  const spd=ANIMAL_SPD[f.id]||.3;
  w.ox+=dx/d*spd;w.oy+=dy/d*spd;
  return w;
}
function clearWander(){for(const k in wander)delete wander[k];}
let T=0;
function loop(){T++;
  const sp=1.2;keys.any=false;
  if(keys.ArrowLeft){px-=sp;dir=-1;keys.any=true;}
  if(keys.ArrowRight){px+=sp;dir=1;keys.any=true;}
  if(keys.ArrowUp){py-=sp;keys.any=true;}
  if(keys.ArrowDown){py+=sp;keys.any=true;}
  px=Math.max(8,Math.min(304,px));py=Math.max(60,Math.min(165,py));
  drawScene(S.scene,T);
  const placed=(S.placed[S.scene]||[]);
  lastRend=placed.map((f,i)=>{
    let ox=0,oy=0;
    if(ANIMAL_SPD[f.id]!==undefined&&dragIdx!==i){
      const w=stepWander(S.scene+"_"+i,f);ox=w.ox;oy=w.oy;}
    return {id:f.id,x:f.x+ox,y:f.y+oy,flip:f.flip,_i:i};
  });
  lastRend.slice().sort((a,b)=>a.y-b.y).forEach(f=>{
    const fy=FOOTY[f.id]!==undefined?FOOTY[f.id]:14;
    const fw=FOOTW[f.id]!==undefined?FOOTW[f.id]:16;
    const sc=FSCALE[f.id]||1;

    drawFurnScaled(f,T);});

  R(px-6,py+7,14,3,"rgba(20,12,24,.28)");

  const fg=.5+Math.sin(T/13)*.4;

  if(animBubble&&Date.now()<animBubble.until)drawBubble(animBubble.x,animBubble.y,animBubble.text,T);
  for(let i=fx.length-1;i>=0;i--){const h=fx[i];
    h.y+=h.vy;h.life--;h.x+=Math.sin(h.life/6)*.3;
    if(h.life<=0){fx.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,h.life/25);drawHeart(h.x,h.y,h.c);ctx.globalAlpha=1;}

  requestAnimationFrame(loop);
}

  const oldLv=level();
  S.exp+=res.exp;S.coins+=res.coins;
  if(!S.log[today()]){S.log[today()]=[];S.streak++;S.lastDay=today();}
  S.log[today()].push({text,exp:res.exp,coins:res.coins});
  applyDims(res.dims);
  const disc=rollDiscovery(res.exp);
  if(disc){if(!S.collection)S.collection={};
    S.collection[disc.id]=(S.collection[disc.id]||0)+1;
    setTimeout(()=>toast(`✨ 探索发现：${disc.e}「${disc.n}」！`),5600);}
  if(level()>oldLv)setTimeout(()=>toast(`✨ 升级到 Lv.${level()}！`),2800);
  save();refreshUI();
  return res;
}
function currentTask(){return (S.tasks||[]).find(x=>!x.done)||null;}
/* 提示音（WebAudio 合成，无需文件） */
let audioCtx=null,alarmInt=null;
function chime(n){try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  for(let i=0;i<n;i++){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine";o.frequency.value=i%2?659:880;
    const t0=audioCtx.currentTime+i*0.38;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.22,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.34);
    o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+0.38);}
}catch(e){}}
function startAlarm(){stopAlarm();chime(2);alarmInt=setInterval(()=>chime(2),2200);}
function stopAlarm(){if(alarmInt){clearInterval(alarmInt);alarmInt=null;}}
function startWork(){
  const ct=currentTask();
  S.pomo={phase:"work",end:Date.now()+POMO_WORK,task:ct?ct.t:null,taskId:ct?ct.id:null};
  toast(ct?`🍅 开始专注「${ct.t}」！25分钟后见`:"🍅 专注开始！25分钟后见");
}
function pomoClick(){
  chime(0); // 初始化音频上下文（需要用户手势）
  if(!S.pomo){startWork();}
  else if(S.pomo.phase==="work"){S.pomo=null;stopAlarm();toast("没关系，随时可以重新开始🌱");}
  else if(S.pomo.phase==="break"){startWork();}          // 跳过休息 → 直接下一个
  else{stopAlarm();startWork();}                          // 回来了！ → 下一个番茄
  save();updatePomoUI();
}
function pomoPause(){
  if(!S.pomo||S.pomo.phase==="await")return;
  if(S.pomo.pausedLeft!=null){
    S.pomo.end=Date.now()+S.pomo.pausedLeft;delete S.pomo.pausedLeft;toast("▶ 继续！");
  }else{
    S.pomo.pausedLeft=Math.max(0,S.pomo.end-Date.now());toast("⏸ 已暂停");
  }
  save();updatePomoUI();
}
function updatePomoUI(){
  const tEl=document.getElementById("pomoTime"),bEl=document.getElementById("pomoBtn"),
        bar=document.getElementById("pomoBar"),cEl=document.getElementById("pomoCount"),
        pEl=document.getElementById("pomoPause");
  cEl.textContent=`今日 🍅×${(S.pomoDone&&S.pomoDone[today()])||0}`;
  let timeText="25:00";
  if(!S.pomo){
    tEl.textContent="25:00";bEl.textContent="开始专注";bar.style.width="0%";pEl.style.display="none";
    document.title="延迟花园 Delay Garden";
  }else if(S.pomo.phase==="await"){
    tEl.textContent="00:00";bEl.textContent="回来了！";bar.style.width="100%";pEl.style.display="none";
    timeText="00:00";document.title="🔔 回来了吗？ · 延迟花园";
  }else{
    const total=S.pomo.phase==="work"?POMO_WORK:POMO_BREAK;
    const left=S.pomo.pausedLeft!=null?S.pomo.pausedLeft:Math.max(0,S.pomo.end-Date.now());
    const mm=String(Math.floor(left/60000)).padStart(2,"0"),ss=String(Math.floor(left%60000/1000)).padStart(2,"0");
    timeText=`${mm}:${ss}`;tEl.textContent=timeText;
    bEl.textContent=S.pomo.phase==="work"?"放弃":"跳过休息";
    pEl.style.display="inline-block";pEl.textContent=S.pomo.pausedLeft!=null?"▶":"⏸";
    bar.style.width=(100-left/total*100)+"%";
    document.title=`${S.pomo.pausedLeft!=null?"⏸":S.pomo.phase==="work"?"🍅":"☕"} ${timeText} · 延迟花园`;
  }
  // 置顶小胶囊
  const pill=document.getElementById("pill"),ct=currentTask();
  if(S.pomo||ct){
    let s="";
    if(S.pomo)s+=(S.pomo.phase==="await"?"🔔 ":S.pomo.pausedLeft!=null?"⏸ ":S.pomo.phase==="work"?"🍅 ":"☕ ")+timeText;
    if(ct)s+=(s?" · ":"")+ct.t+` 🍅${ct.spent||0}/${ct.est||"?"}`;
    pill.textContent=s;pill.style.display="block";
  }else pill.style.display="none";
}
setInterval(()=>{
  if(S.pomo&&S.pomo.phase!=="await"&&S.pomo.pausedLeft==null&&S.pomo.end-Date.now()<=0){
    if(S.pomo.phase==="work"){
      if(!S.pomoDone)S.pomoDone={};
      S.pomoDone[today()]=(S.pomoDone[today()]||0)+1;
      const task=S.pomo.task,tid=S.pomo.taskId;
      if(tid!=null){const tt=(S.tasks||[]).find(a=>a.id===tid);if(tt)tt.spent=(tt.spent||0)+1;}
      S.pomo={phase:"break",end:Date.now()+POMO_BREAK};
      chime(4);
      toast("🍅 番茄完成！休息5分钟～");
      setTimeout(()=>submitAuto(task?`专注25分钟推进「${task}」，没有切换任务`:"完整专注了一个25分钟番茄钟"),2600);
      renderTasks();
    }else{
      S.pomo={phase:"await"};
      startAlarm();
      toast("☕ 休息结束！点「回来了」开始下一个番茄");
    }
    save();
  }
  updatePomoUI();
},1000);
function addTask(){
  const i=document.getElementById("taskInput"),v=i.value.trim();
  const est=Math.max(1,Math.min(12,parseInt(document.getElementById("taskEst").value)||1));
  if(!v)return;
  if(!S.tasks)S.tasks=[];
  S.tasks.push({t:v,done:false,day:today(),est:est,spent:0,id:Date.now()});
  i.value="";save();renderTasks();updatePomoUI();
}
document.getElementById("taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});
function toggleTask(i){
  const t=S.tasks[i];
  if(t.done)return;
  t.done=true;t.day=today();
  submitAuto(`先做完了「${t.t}」，才去休息`);
  // 神秘大奖：预估精准（实际与预估相差≤1个番茄）
  if(t.est&&Math.abs((t.spent||0)-t.est)<=1){
    S.coins+=12;
    if(!S.collection)S.collection={};
    S.collection.hourglass=(S.collection.hourglass||0)+1;
    setTimeout(()=>toast("🎊 神秘大奖！预估精准 +12🪙，还有一件特别的东西进了图鉴…"),3000);
  }
  renderTasks();updatePomoUI();
}
/* 置顶胶囊拖拽 */
(function(){
  const pill=document.getElementById("pill");
  const p=localStorage.getItem("pillPos");
  if(p){try{const o=JSON.parse(p);pill.style.left=o.x+"px";pill.style.top=o.y+"px";pill.style.right="auto";}catch(e){}}
  let pd=null;
  pill.addEventListener("mousedown",e=>{pd={dx:e.clientX-pill.offsetLeft,dy:e.clientY-pill.offsetTop};e.preventDefault();});
  window.addEventListener("mousemove",e=>{if(!pd)return;
    pill.style.left=Math.max(0,e.clientX-pd.dx)+"px";pill.style.top=Math.max(0,e.clientY-pd.dy)+"px";pill.style.right="auto";});
  window.addEventListener("mouseup",()=>{if(pd){localStorage.setItem("pillPos",JSON.stringify({x:pill.offsetLeft,y:pill.offsetTop}));pd=null;}});
})();
function renderTasks(){
  S.tasks=(S.tasks||[]).filter(t=>!t.done||t.day===today());
  const el=document.getElementById("taskList");el.innerHTML="";
  S.tasks.forEach((t,i)=>{
    const d=document.createElement("div");
    d.style.cssText="display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed #d8c090;";
    const chk=document.createElement("span");chk.style.cursor="pointer";chk.textContent=t.done?"✅":"⬜";
    chk.onclick=()=>toggleTask(i);
    const txt=document.createElement("span");txt.style.cssText="flex:1;"+(t.done?"text-decoration:line-through;opacity:.55;":"");
    txt.textContent=t.t+(t.est?`　🍅${t.spent||0}/${t.est}`:"");
    const del=document.createElement("span");del.style.cssText="cursor:pointer;opacity:.45;";del.textContent="✕";
    del.onclick=()=>{S.tasks.splice(i,1);save();renderTasks();};
    d.append(chk,txt,del);el.appendChild(d);
  });
  if(!S.tasks.length){const h=document.createElement("span");h.className="hint";h.textContent="没有任务～加一件想专注的事吧";el.appendChild(h);}
}
/* 领取悬浮球提交的记录 */
setInterval(async()=>{
  try{
    const r=await fetch("/api/pending");const arr=await r.json();
    if(!Array.isArray(arr)||!arr.length)return;
    const oldLv=level(),oldUnlocked=SCENES.filter(s=>S.exp>=s.need).length;
    let sumE=0,sumC=0;
    arr.forEach(p=>{S.exp+=p.exp;S.coins+=p.coins;sumE+=p.exp;sumC+=p.coins;
      if(!S.log[p.day]){S.log[p.day]=[];if(p.day===today()){S.streak++;S.lastDay=p.day;}}
      S.log[p.day].push({text:p.text,exp:p.exp,coins:p.coins});
      applyDims(p.dims);
      const disc=rollDiscovery(p.exp);
      if(disc){if(!S.collection)S.collection={};
        S.collection[disc.id]=(S.collection[disc.id]||0)+1;
        setTimeout(()=>toast(`✨ 探索发现：${disc.e}「${disc.n}」！`),5600);}});
    await fetch("/api/pending_clear",{method:"POST",body:"{}"});
    toast(`🌿 悬浮球记录入账 +${sumE} EXP +${sumC} 🪙`);
    if(level()>oldLv)setTimeout(()=>toast(`✨ 升级到 Lv.${level()}！`),2800);
    const nu=SCENES.filter(s=>S.exp>=s.need).length;
    if(nu>oldUnlocked)setTimeout(()=>toast(`🗺 新场景「${SCENES[nu-1].name}」被发现了！`),2800);
    save();refreshUI();
  }catch(e){}
},6000);
load().then(()=>{renderTasks();updatePomoUI();
  // 开屏问候（按时间段）
  const h=new Date().getHours();
  const greet=h<5?"夜深了…记得零点前睡哦":h<11?"早上好！新的一天从记录开始":h<14?"中午好～吃好喝好再开工":h<18?"下午好！来个番茄吗？":"晚上好，今天辛苦了";
  charBubble={text:greet,until:Date.now()+4200};
  loop();});
</script>
